<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><rect width="1200" height="8" fill="#ab7e22"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#111"><text x="60" y="83" font-size="17" letter-spacing="3" fill="#765415">GOLD PRICE TODAY / KNOW THE UNITS</text><text x="60" y="154" font-size="48" font-weight="700">An ounce. A gram. A clear value.</text><rect x="60" y="207" width="1080" height="290" rx="22" fill="#faf8f2" stroke="#d9c9a4"/><rect x="95" y="242" width="145" height="145" rx="14" fill="#efe3c3"/><text x="116" y="275" font-size="18">79</text><text x="166" y="340" text-anchor="middle" font-size="64" font-weight="700">Au</text><text x="167" y="369" text-anchor="middle" font-size="16">GOLD</text><text x="290" y="280" font-size="22">1 troy ounce</text><text x="290" y="333" font-size="42" font-weight="700">31.1034768 grams</text><text x="290" y="375" font-size="22">1 kilogram = 1,000 grams</text><path d="M290 403 H1090" stroke="#d9c9a4"/><text x="290" y="449" font-size="23">Spot value = troy ounces × price × purity</text><text x="60" y="584" font-size="18" font-weight="700" letter-spacing="3">DEVIN FOREX</text><text x="1140" y="584" text-anchor="end" font-size="16">Clear prices. Useful context.</text></g></svg>