<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><rect width="1200" height="8" fill="#ab7e22"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#111"><text x="60" y="83" font-size="17" letter-spacing="3" fill="#765415">GOLD AND SILVER SPOT PRICES</text><text x="60" y="154" font-size="48" font-weight="700">Two prices. One useful ratio.</text><rect x="60" y="215" width="430" height="185" rx="18" fill="#faf6eb" stroke="#d9c9a4"/><text x="93" y="268" font-size="23" font-weight="700">GOLD / XAU</text><text x="93" y="325" font-size="32">USD per troy ounce</text><text x="540" y="330" text-anchor="middle" font-size="66">÷</text><rect x="595" y="215" width="545" height="185" rx="18" fill="#f2f5f8" stroke="#ccd3dc"/><text x="630" y="268" font-size="23" font-weight="700">SILVER / XAG</text><text x="630" y="325" font-size="32">USD per troy ounce</text><text x="60" y="468" font-size="25">The ratio counts silver ounces per gold ounce.</text><text x="60" y="506" font-size="20" fill="#444">Use matching currencies and units. A ratio is not a trading signal.</text><text x="60" y="584" font-size="18" font-weight="700" letter-spacing="3">DEVIN FOREX</text><text x="1140" y="584" text-anchor="end" font-size="16">Clear prices. Useful context.</text></g></svg>